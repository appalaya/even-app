# Checks every pull request and every push to main. Cheap on purpose: one Linux job,
# no simulator, no secrets.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Typecheck, lint, tests, landing page
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: App tests
        run: npx vitest run

      - name: Core tests
        run: npm test -w @even/core

      - name: Landing page
        run: node web/scripts/check.mjs

      - name: TestFlight What to Test is under 1 KB
        run: |
          bytes=$(wc -c < TestFlight/WhatToTest.en-US.txt | tr -d ' ')
          if [ "$bytes" -ge 1024 ]; then
            echo "::error file=TestFlight/WhatToTest.en-US.txt::What to Test is $bytes bytes; TestFlight truncates at 1 KB."
            exit 1
          fi
          echo "What to Test: $bytes bytes"
