# iOS releases. See RELEASE.md.
#
# - Push to main: archive, sign and upload a TestFlight build. The internal group
#   "Alpha" gets it through App Store Connect's automatic distribution.
# - Push a tag beta/<version>-<build>: give that already uploaded build to the external
#   group "Family & Friends", with the What to Test text from the tagged commit.
#
# iOS builds are made here and nowhere else. The Xcode project in ios/ is committed and
# regenerated by hand (RELEASE.md, "The native project"); this workflow never runs prebuild.

name: iOS

on:
  push:
    branches: [main]
    tags: ['beta/*']
    # Changes that cannot alter the iOS app do not make a TestFlight build.
    # (Path filters are not evaluated for tag pushes.)
    paths-ignore:
      - 'web/**'
      - 'docs/**'
      - 'android/**'
      - '.github/workflows/android.yml'
      - '.github/workflows/ci.yml'
      - '.github/actionlint.yaml'
      - '.github/workflows/web.yml'
      - '.github/workflows/asc-readiness.yml'
      - '.github/scripts/**'
      - '.gitignore'
      - 'scripts/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read # the beta job checks which run uploaded the build it is about to promote

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # TestFlight build number = github.run_number + IOS_BUILD_OFFSET (RELEASE.md, "Build numbers").
  # Build numbers must only ever go up: never lower this, only raise it.
  IOS_BUILD_OFFSET: 100
  # Runner image "xcode-27" (RELEASE.md, "Runner image"). Pinned to the Xcode that the
  # project is verified with locally.
  XCODE_APP: /Applications/Xcode_27.0.app
  TEAM_ID: 9S29T387N4
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  FASTLANE_SKIP_UPDATE_CHECK: '1'
  FASTLANE_HIDE_CHANGELOG: '1'
  EXPO_NO_TELEMETRY: '1'
  # libsodium for the native XChaCha20-Poly1305 (modules/even-crypto): swift-sodium 0.11.0's prebuilt xcframework,
  # a Swift package. The commit Package.resolved must pin, and the sha256 of the two iOS slices at that commit
  # (RELEASE.md, "The native project"). Change all three together, never one.
  SWIFT_SODIUM_REVISION: cfd195c76882aa9b997560ca7cb95d72fbf5db00
  LIBSODIUM_IOS_SHA256: d678dc76dbc6e34d30954f3644622aae8cbbacf3da03226416e7684196e65393
  LIBSODIUM_SIMULATOR_SHA256: b59ff5ecd5d00674d1dd52c8155b613ebbcaf630cf6a7b29e0710dff7dd38e17

jobs:
  build:
    name: Build and upload to TestFlight (Alpha)
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      HAS_DEV_CERT: ${{ secrets.IOS_DEV_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Version and build number
        id: version
        run: |
          version=$(node -p "require('./app.json').expo.version")
          build=$(( GITHUB_RUN_NUMBER + IOS_BUILD_OFFSET ))
          notes_bytes=$(wc -c < TestFlight/WhatToTest.en-US.txt | tr -d ' ')
          if [ "$notes_bytes" -ge 1024 ]; then
            echo "::error file=TestFlight/WhatToTest.en-US.txt::What to Test is $notes_bytes bytes; TestFlight truncates at 1 KB."
            exit 1
          fi
          # Expo writes literal versions into Info.plist, so the build settings alone would
          # not reach the bundle. This edits the runner's checkout only.
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" ios/Even/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $build" ios/Even/Info.plist
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "### Even $version ($build) from ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/logs"
          echo "LOGS=$RUNNER_TEMP/logs" >> "$GITHUB_ENV"

      - name: Write the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (RELEASE.md, \"Secrets\")."
              exit 1
            fi
          done
          dir="$RUNNER_TEMP/asc"
          mkdir -p "$dir"
          chmod 700 "$dir"
          key="$dir/AuthKey_$ASC_KEY_ID.p8"
          # The secret is the .p8 file, pasted as is or base64-encoded.
          if printf '%s' "$ASC_KEY_P8" | grep -q -- '-----BEGIN PRIVATE KEY-----'; then
            printf '%s\n' "$ASC_KEY_P8" > "$key"
          else
            printf '%s' "$ASC_KEY_P8" | tr -d ' \r\n' | base64 --decode > "$key" 2>/dev/null || true
          fi
          chmod 600 "$key"
          if ! grep -q -- '-----BEGIN PRIVATE KEY-----' "$key" || ! grep -q -- '-----END PRIVATE KEY-----' "$key"; then
            echo "::error::ASC_KEY_P8 is neither a .p8 file nor its base64 (RELEASE.md, \"Secrets\")."
            exit 1
          fi
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      # Optional. Without it, Xcode asks Apple for a new development certificate on every
      # fresh runner (RELEASE.md, "Signing").
      - name: Install the development certificate
        if: env.HAS_DEV_CERT == 'true'
        env:
          IOS_DEV_CERT_P12: ${{ secrets.IOS_DEV_CERT_P12 }}
          IOS_DEV_CERT_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          p12="$RUNNER_TEMP/asc/development.p12"
          printf '%s' "$IOS_DEV_CERT_P12" | tr -d ' \r\n' | base64 --decode > "$p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$p12" -k "$keychain" -f pkcs12 -P "$IOS_DEV_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          existing=$(security list-keychains -d user | tr -d '"')
          # shellcheck disable=SC2086 # one keychain path per word
          security list-keychains -d user -s "$keychain" $existing
          rm -f "$p12"
          security find-identity -v -p codesigning "$keychain"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Restore CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ runner.arch }}-xcode27-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-${{ runner.arch }}-xcode27-

      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Check the swift-sodium pin
        run: |
          resolved=ios/Even.xcworkspace/xcshareddata/swiftpm/Package.resolved
          pinned=$(jq -r '.pins[] | select(.identity == "swift-sodium") | .state.revision' "$resolved")
          if [ "$pinned" != "$SWIFT_SODIUM_REVISION" ]; then
            echo "::error file=$resolved::swift-sodium is pinned to '$pinned', not $SWIFT_SODIUM_REVISION (RELEASE.md)."
            exit 1
          fi

      # Fetches the Swift packages at exactly the versions Package.resolved records, into a folder this job knows,
      # so the next step can check the bytes the archive will link.
      - name: Resolve Swift packages
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -workspace ios/Even.xcworkspace \
            -scheme Even \
            -onlyUsePackageVersionsFromResolvedFile \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            2>&1 | tee "$LOGS/resolve.log"

      - name: Check libsodium
        run: |
          checkout="$RUNNER_TEMP/SourcePackages/checkouts/swift-sodium"
          revision=$(git -C "$checkout" rev-parse HEAD)
          if [ "$revision" != "$SWIFT_SODIUM_REVISION" ]; then
            echo "::error::swift-sodium was checked out at $revision, not $SWIFT_SODIUM_REVISION."
            exit 1
          fi
          framework="$checkout/Clibsodium.xcframework"
          printf '%s  %s\n' \
            "$LIBSODIUM_IOS_SHA256" "$framework/ios-arm64_arm64e/libsodium.a" \
            "$LIBSODIUM_SIMULATOR_SHA256" "$framework/ios-arm64_arm64e_x86_64-simulator/libsodium.a" \
            | shasum -a 256 --check

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Even.xcworkspace \
            -scheme Even \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Even.xcarchive" \
            -onlyUsePackageVersionsFromResolvedFile \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            MARKETING_VERSION="$VERSION" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            2>&1 | tee "$LOGS/archive.log" | xcbeautify --renderer github-actions

      - name: Export the .ipa
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # Re-signs the development-signed archive for App Store Connect with a
          # cloud-managed distribution certificate.
          if ! xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Even.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist fastlane/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" > "$LOGS/export.log" 2>&1; then
            cat "$LOGS/export.log"
            # The real reason for an export failure is often only in this bundle.
            bundle=$(grep -o '/[^"]*\.xcdistributionlogs' "$LOGS/export.log" | tail -1 || true)
            if [ -n "$bundle" ] && [ -d "$bundle" ]; then cp -R "$bundle" "$LOGS/"; fi
            exit 1
          fi
          cat "$LOGS/export.log"
          ipa=$(ls "$RUNNER_TEMP"/export/*.ipa)
          echo "IPA_PATH=$ipa" >> "$GITHUB_ENV"

      - name: Keep the .ipa and dSYMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: even-ios-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/Even.xcarchive/dSYMs/
          if-no-files-found: error

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          WHAT_TO_TEST: ${{ github.workspace }}/TestFlight/WhatToTest.en-US.txt
        run: fastlane ios alpha

      - name: Summary
        env:
          TAG: beta/${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}
        run: |
          echo "Uploaded to TestFlight. Alpha gets it when App Store Connect finishes processing." >> "$GITHUB_STEP_SUMMARY"
          echo "To give this build to Family & Friends, tag this commit \`$TAG\` and push the tag." >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the build logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcodebuild-logs-${{ steps.version.outputs.build }}
          path: ${{ runner.temp }}/logs/
          if-no-files-found: ignore

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/asc"

  family-and-friends:
    name: Give the build to Family & Friends
    if: startsWith(github.ref, 'refs/tags/beta/')
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (RELEASE.md, \"Secrets\")."
              exit 1
            fi
          done
          dir="$RUNNER_TEMP/asc"
          mkdir -p "$dir"
          chmod 700 "$dir"
          key="$dir/AuthKey_$ASC_KEY_ID.p8"
          # The secret is the .p8 file, pasted as is or base64-encoded.
          if printf '%s' "$ASC_KEY_P8" | grep -q -- '-----BEGIN PRIVATE KEY-----'; then
            printf '%s\n' "$ASC_KEY_P8" > "$key"
          else
            printf '%s' "$ASC_KEY_P8" | tr -d ' \r\n' | base64 --decode > "$key" 2>/dev/null || true
          fi
          chmod 600 "$key"
          if ! grep -q -- '-----BEGIN PRIVATE KEY-----' "$key" || ! grep -q -- '-----END PRIVATE KEY-----' "$key"; then
            echo "::error::ASC_KEY_P8 is neither a .p8 file nor its base64 (RELEASE.md, \"Secrets\")."
            exit 1
          fi
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Read the tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^beta/([0-9]+(\.[0-9]+)*)-([0-9]+)$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not beta/<version>-<build>, for example beta/1.0.0-105."
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          build="${BASH_REMATCH[3]}"
          app_version=$(node -p "require('./app.json').expo.version")
          if [ "$version" != "$app_version" ]; then
            echo "::error::The tag says version $version but app.json at this commit says $app_version."
            exit 1
          fi
          # Build N came from run N - IOS_BUILD_OFFSET of this workflow. Refuse to promote a
          # build that was not made from the tagged commit.
          commit=$(git rev-parse HEAD)
          run=$(( build - IOS_BUILD_OFFSET ))
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ios.yml/runs?head_sha=$commit&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.head_branch == "main") | .run_number | tostring] | join(" ")')
          if [[ " $runs " != *" $run "* ]]; then
            echo "::error::Build $build was not uploaded from ${commit::7} (it would be run #$run of this workflow; successful main runs of this commit: ${runs:-none}). Tag the commit that build was made from."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Distribute to Family & Friends
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          WHAT_TO_TEST: ${{ github.workspace }}/TestFlight/WhatToTest.en-US.txt
          VERSION: ${{ steps.tag.outputs.version }}
          BUILD: ${{ steps.tag.outputs.build }}
        run: |
          fastlane ios family_and_friends version:"$VERSION" build:"$BUILD"
          echo "### Even $VERSION ($BUILD) given to Family & Friends" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
