<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Not found · Even</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<div class="wrap">

<header class="top">
  <a class="lockup" href="/">
    <svg class="mark" width="28" height="28" viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="8"><path d="M20 50H84"/><path d="M64 50A22 22 0 1 0 56.14 66.85"/><path d="M66 63H86"/></g></svg>
    Even
  </a>
</header>

<main class="doc">
  <h1>Nothing here</h1>
  <p>This page does not exist. <a href="/">Go to the home page</a>.</p>
</main>

</div>
<script id="from-app">
// ?from=app: the Even app opened this page (web/README.md, "Pages the app opens"). Then nothing here leads to the
// home page's tip card: the header lockup, and links to anywhere but the app stores and GitHub, become plain text;
// the tip card goes; links to this site's pages keep the flag. The same bytes on every page, allowed by one hash.
(() => {
  'use strict';
  if (new URLSearchParams(location.search).get('from') !== 'app') return;
  const KEEP = /^https:\/\/(?:apps\.apple\.com|play\.google\.com|github\.com\/appalaya)\//;
  for (const tip of document.querySelectorAll('.tip')) tip.remove();
  for (const a of document.querySelectorAll('a[href]')) {
    let url = null;
    try {
      url = new URL(a.href);
    } catch {}
    if (url !== null && url.protocol !== 'https:' && url.protocol !== 'http:') continue;
    const here = url !== null && url.origin === location.origin;
    if (here && !a.classList.contains('lockup')) {
      url.searchParams.set('from', 'app');
      a.setAttribute('href', url.pathname + url.search + url.hash);
    } else if (here || url === null || !KEEP.test(url.href)) {
      const text = document.createElement('span');
      if (a.className !== '') text.className = a.className;
      text.append(...a.childNodes);
      a.replaceWith(text);
    }
  }
})();
</script>
</body>
</html>
