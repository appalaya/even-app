plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.appalaya.even.crypto'
version = '0.1.0'

android {
  namespace "com.appalaya.even.crypto"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // XChaCha20-Poly1305 (IETF): Google Tink's pure-Java implementation, the class Tink's own public
  // subtle.XChaCha20Poly1305 delegates to. Pinned exactly; no native library, so nothing to align for 16 KB pages.
  implementation 'com.google.crypto.tink:tink-android:1.23.0'
}
